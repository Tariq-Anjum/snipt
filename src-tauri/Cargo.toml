[package]
name = "snipt"
version.workspace = true
description = "Snipt: offline SMS organiser (Tauri shell over the sms-* crates)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "snipt"

[lib]
name = "snipt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "snipt"
path = "src/main.rs"

[features]
# Exposes the `import_seed` command in release builds too. It is always
# available in debug builds (`debug_assertions`).
dev-seed = []

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
chrono.workspace = true
sms-types.workspace = true
sms-engine.workspace = true
sms-store.workspace = true
sms-crypto.workspace = true
sms-testdata.workspace = true
zeroize.workspace = true
tauri-plugin-telephony.workspace = true

# JNI bridge for the background SMS receiver (no WebView). Same `jni` version
# Tauri/wry already link on Android (Cargo.lock), so no second copy is built.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.21.1", default-features = false }

# Linux save/open dialogs for the encrypted backup (desktop only; Android uses SAF).
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-dialog = "=2.8.4"
