"$schema" = "schemas/schema.json"

[default]
description = "Snipt Android shell: default-SMS role request, status, sensitive copy, FLAG_SECURE, display boost, first-run provider import and the SENDTO draft hand-off."
permissions = [
  "allow-request-default-sms-role",
  "allow-status",
  "allow-copy-sensitive",
  "allow-set-secure",
  "allow-display-boost",
  "allow-import-inbox",
  "allow-take-compose",
]
